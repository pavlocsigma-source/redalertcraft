name: Build Mod

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack sources
        run: |
          unzip -q rac-src.zip -d work
          if [ -f work/build.gradle ]; then
            echo "PROJECT_DIR=work" >> $GITHUB_ENV
          else
            DIR=$(find work -name build.gradle -printf '%h\n' | head -1)
            echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build with Gradle
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Prepare jar
        run: |
          mkdir -p out
          cp "$PROJECT_DIR"/build/libs/*.jar out/

      - uses: actions/upload-artifact@v4
        with:
          name: redalertcraft-jar
          path: out/*.jar
